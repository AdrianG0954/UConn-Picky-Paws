services:
  database:
    image: postgres:18.1-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # volumes:
    #   - sdp_test_db_data:/var/lib/postgresql # use defined volume

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 1m
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - .:/app # Mount the current directory to /app in the container

  populate_db:
    restart: "no"
    build:
      context: .
      dockerfile: Dockerfile.populate
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Named volume hides image node_modules; sync deps from lockfile on every start.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      PROXY_TARGET: http://backend:8000
      DOCKER_DEV: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
