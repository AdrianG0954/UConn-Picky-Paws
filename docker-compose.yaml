services:
  database:
    image: postgres:18.1-alpine
    restart: on-failure
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # volumes:
    #   - sdp_test_db_data:/var/lib/postgresql # use defined volume

  backend:
    restart: on-failure
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 1m30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - .:/app # Mount the current directory to /app in the container
